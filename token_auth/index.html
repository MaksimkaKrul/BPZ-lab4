<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth0 SSO</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        html { height: 100%; }
        body {
            height: 100%; margin: 0; font-family: Arial, Helvetica, sans-serif;
            display: grid; justify-items: center; align-items: center; background-color: #3a3a3a;
        }
        #main-holder {
            width: 450px; padding: 30px; display: flex; flex-direction: column;
            align-items: center; background-color: white; border-radius: 7px;
            box-shadow: 0px 0px 5px 2px black; box-sizing: border-box;
        }
        .btn {
            width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 5px;
            color: white; font-weight: bold; background-color: #4a4a4a; cursor: pointer;
            text-align: center; text-decoration: none; font-size: 16px;
        }
        .token-box {
            width: 100%; height: 80px; padding: 10px; box-sizing: border-box; 
            font-family: monospace; font-size: 10px; resize: none; 
            background-color: #f0f0f0; border: 1px solid #ccc; border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <main id="main-holder">
        <h1 style="margin-top: 0;">Welcome</h1>
        <a href="/api/login" class="btn">Login with Auth0 SSO</a>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            document.getElementById("main-holder").innerHTML = "<h2>Processing login...</h2>";
            axios.post('/api/callback', { code: code }).then((response) => {
                sessionStorage.setItem('session', JSON.stringify(response.data));
                window.history.replaceState({}, document.title, "/");
                location.reload();
            }).catch(() => {
                document.getElementById("main-holder").innerHTML = "<h2 style='color:red; text-align:center;'>Login Error! Check server console.</h2><a href='/' class='btn'>Try Again</a>";
            });
        } else {
            const session = sessionStorage.getItem('session');
            let token;
            try { token = JSON.parse(session).token; } catch(e) {}

            if (token) {
                axios.get('/api/me', { headers: { Authorization: token } }).then((response) => {
                    const data = response.data;
                    if (data.username) {
                        const mainHolder = document.getElementById("main-holder");
                        mainHolder.innerHTML = `
                            <h1 style="margin-top: 0; margin-bottom: 5px;">SSO Successful</h1>
                            <div style="width: 100%; text-align: left; margin-top: 15px; line-height: 1.6;">
                                <div><b>User:</b> ${data.username}</div>
                                <div><b>Token Type:</b> ${data.token_type}</div>
                                <div><b>Expires In:</b> ${data.expires_in} seconds</div>
                                
                                <div style="margin-top: 10px;"><b>ID Token:</b></div>
                                <textarea readonly class="token-box">${data.id_token}</textarea>

                                <div style="margin-top: 10px;"><b>Access Token:</b></div>
                                <textarea readonly class="token-box">${data.access_token}</textarea>
                            </div>
                            <button id="logout-btn" class="btn">Logout</button>
                        `;
                        document.getElementById("logout-btn").addEventListener("click", () => {
                            sessionStorage.removeItem('session'); 
                            location.href = '/logout';
                        });
                    }
                }).catch(() => {
                    sessionStorage.removeItem('session');
                });
            }
        }
    </script>
</body>
</html>
